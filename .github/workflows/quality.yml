name: Quality
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: ERPNext source and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - name: Validate source and promotion policy
        run: |
          python3 scripts/check-policy.py
          python3 -m unittest discover -s tests -v
          bash -n scripts/prepare-runtime.sh deploy/configure.sh deploy/create-site.sh tests/runtime-smoke.sh
          git diff --check
  runtime:
    name: ERPNext runtime integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0
        with:
          persist-credentials: false
      - name: Install a fresh synthetic runtime and verify persistence
        run: bash tests/runtime-smoke.sh
